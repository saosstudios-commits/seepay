<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SeePay — Your shop, online by lunchtime</title>
<meta name="description" content="Get your own shop link, take orders and get paid by Mobile Money. For any small business in Ghana.">
<link rel="icon" href="/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,600&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS & RESET ============ */
:root{
  --g950:#071E15; --g900:#0B2E21; --g800:#0E3B2C; --g700:#175E43; --g600:#1F7A57;
  --g100:#DDEBE1; --g50:#EEF4EF;
  --gold:#FFC83D; --gold-d:#E3A81C; --gold-100:#FFF1CE; --gold-700:#7A5A00;
  --red:#E4402F; --red-d:#C22F1F; --red-50:#FDECEA;
  --ink:#17251E; --ink2:#46564D; --ink3:#75847B;
  --paper:#FAF8F1; --warm:#F3F1E9; --card:#fff;
  --line:#E7E3D6; --line2:#D9D4C4;
  --sans:"Instrument Sans",system-ui,sans-serif; --disp:"Fraunces",Georgia,serif;
  --sh1:0 1px 2px rgba(11,46,33,.05); --sh2:0 2px 6px rgba(11,46,33,.06),0 12px 32px rgba(11,46,33,.09);
  --sh3:0 4px 12px rgba(11,46,33,.10),0 24px 60px rgba(11,46,33,.16);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font:400 15.5px/1.55 var(--sans);color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased}
img,svg{display:block} a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
::selection{background:var(--gold);color:var(--g950)}
:focus-visible{outline:2px solid var(--gold-d);outline-offset:2px;border-radius:4px}
h1,h2,h3{font-family:var(--disp);font-weight:600;letter-spacing:-.01em;line-height:1.12;color:var(--g900)}
.wrap{max-width:1200px;margin:0 auto;padding:0 24px}
.wrap-w{max-width:1400px;margin:0 auto;padding:0 24px}
.ic{flex:none;vertical-align:-3px}
.kente{height:4px;background:repeating-linear-gradient(90deg,var(--gold) 0 30px,var(--red) 30px 42px,var(--g900) 42px 66px,var(--gold) 66px 74px,var(--g700) 74px 86px)}
.muted{color:var(--ink3)} .sm{font-size:13.5px} .xs{font-size:12px} .b{font-weight:700} .sb{font-weight:600}
.mono{font-variant-numeric:tabular-nums}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--g700)}
.eyebrow::before{content:"";width:22px;height:2px;background:var(--gold)}
.skip{position:absolute;left:-9999px}.skip:focus{left:12px;top:12px;z-index:200;background:#fff;padding:10px 14px;border-radius:8px}
/* ============ BUTTONS / CHIPS / BADGES ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:600 15px/1 var(--sans);padding:0 20px;height:46px;border-radius:9px;border:1px solid transparent;white-space:nowrap;transition:background .15s,border-color .15s,transform .06s;text-decoration:none}
.btn:active{transform:translateY(1px)}
.btn-gold{background:var(--gold);color:#241A02;box-shadow:0 1px 0 rgba(0,0,0,.1)} .btn-gold:hover{background:#FFD361}
.btn-dark{background:var(--g900);color:#fff} .btn-dark:hover{background:var(--g800)}
.btn-outline{border-color:var(--line2);background:#fff;color:var(--ink)} .btn-outline:hover{border-color:var(--ink3)}
.btn-ghost{color:var(--g800)} .btn-ghost:hover{background:var(--g50)}
.btn-danger{background:var(--red);color:#fff} .btn-danger:hover{background:var(--red-d)}
.btn-sm{height:36px;padding:0 14px;font-size:13.5px;border-radius:7px}
.btn-lg{height:52px;font-size:16px;padding:0 26px;border-radius:11px}
.btn-block{width:100%} .btn[disabled]{opacity:.45;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;padding:7px 13px;border-radius:999px;border:1px solid var(--line2);background:#fff;color:var(--ink2);transition:.15s}
button.chip:hover{border-color:var(--g700);color:var(--g900)}
button.chip.on{background:var(--g900);border-color:var(--g900);color:#fff}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.b-green{background:var(--g100);color:var(--g700)} .b-gold{background:var(--gold-100);color:var(--gold-700)}
.b-red{background:var(--red-50);color:var(--red-d)} .b-gray{background:#EFEDE6;color:var(--ink2)}
.b-dark{background:var(--g900);color:var(--gold)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
/* ============ FORMS ============ */
.field{margin-bottom:18px}
.field>label{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;font-weight:700;margin-bottom:7px}
.field>label .opt{font-weight:500;color:var(--ink3);font-size:12px}
.control{position:relative}
.input,select.input,textarea.input{width:100%;height:46px;border:1px solid var(--line2);border-radius:9px;padding:0 14px;font:500 15px var(--sans);background:#fff;transition:border-color .15s,box-shadow .15s}
textarea.input{height:auto;min-height:96px;padding:11px 14px;resize:vertical}
.input:focus{outline:none;border-color:var(--g700);box-shadow:0 0 0 3px var(--g100)}
.input::placeholder{color:#A5AFA6}
.field.error .input{border-color:var(--red);box-shadow:0 0 0 3px var(--red-50)}
.ferr{display:none;align-items:center;gap:6px;color:var(--red-d);font-size:13px;font-weight:600;margin-top:7px}
.field.error .ferr{display:flex}
.fhelp{color:var(--ink3);font-size:13px;margin-top:7px}
.suffix-wrap{display:flex}
.suffix-wrap .input{border-radius:9px 0 0 9px}
.suffix{display:flex;align-items:center;padding:0 14px;border:1px solid var(--line2);border-left:0;border-radius:0 9px 9px 0;background:var(--warm);font-weight:600;font-size:14px;color:var(--ink2)}
.eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:34px;height:34px;display:grid;place-items:center;border-radius:7px;color:var(--ink3)}
.eye:hover{background:var(--warm);color:var(--ink)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;cursor:pointer}
.check input{width:18px;height:18px;margin-top:2px;accent-color:var(--g700)}
.switch{width:40px;height:23px;border-radius:99px;background:#D8D3C3;position:relative;transition:background .18s;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .18s}
.switch.on{background:var(--g600)} .switch.on::after{left:20px}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line2);border-radius:9px;background:#fff;overflow:hidden}
.qty button{width:36px;height:38px;display:grid;place-items:center;color:var(--ink2)}
.qty button:hover{background:var(--warm)}
.qty span{min-width:38px;text-align:center;font-weight:700;font-size:14px}
.radio-card{display:flex;align-items:center;gap:13px;border:1.5px solid var(--line2);border-radius:11px;padding:14px 16px;cursor:pointer;background:#fff;transition:.15s;position:relative}
.radio-card:hover{border-color:var(--ink3)}
.radio-card input{position:absolute;opacity:0}
.radio-card .rc-dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--line2);flex:none;display:grid;place-items:center;margin-left:auto}
.radio-card.sel{border-color:var(--g800);background:var(--g50);box-shadow:0 0 0 1px var(--g800)}
.radio-card.sel .rc-dot{border-color:var(--g800)} .radio-card.sel .rc-dot::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--g700)}
.net-dot{width:12px;height:12px;border-radius:4px;flex:none}
/* ============ CARDS / SECTIONS ============ */
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh1)}
.pad{padding:20px} .pad-l{padding:28px}
.section{padding:88px 0} .section.tight{padding:56px 0}
.sec-head{max-width:660px;margin-bottom:44px}
.sec-head h2{font-size:clamp(28px,3.6vw,42px);margin:14px 0 12px}
.sec-head p{color:var(--ink2);font-size:16.5px}
.divider{border:0;border-top:1px solid var(--line)}
/* ============ LOGO / HEADER / FOOTER ============ */
.brand{display:inline-flex;align-items:center;gap:10px;flex:none}
.logo-mark{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;flex:none;overflow:hidden}
.logo-mark svg{display:block;width:100%;height:100%}
.logo-word{font:700 21px var(--disp);color:var(--g900);letter-spacing:-.01em}
.brand.on-dark .logo-word{color:#fff}
.site-hd{position:sticky;top:0;z-index:60;background:rgba(250,248,241,.93);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);transition:box-shadow .2s}
.site-hd.scrolled{box-shadow:var(--sh2)}
.site-hd-in{display:flex;align-items:center;gap:24px;height:68px}
.site-nav{display:flex;gap:2px;margin-left:6px}
.site-nav .nl{font-size:14.5px;font-weight:600;color:var(--ink2);padding:9px 12px;border-radius:8px;background:none}
.site-nav .nl:hover{color:var(--g900);background:var(--g50)}
.hd-actions{margin-left:auto;display:flex;align-items:center;gap:10px}
.burger{display:none;width:42px;height:42px;place-items:center;border-radius:9px;border:1px solid var(--line2);background:#fff}
.m-drawer{position:fixed;inset:0;z-index:100;pointer-events:none}
.m-drawer .scrim{position:absolute;inset:0;background:rgba(7,30,21,.5);opacity:0;transition:.2s}
.m-panel{position:absolute;top:0;right:0;bottom:0;width:min(360px,88vw);background:#fff;transform:translateX(102%);transition:transform .24s cubic-bezier(.3,.8,.3,1);display:flex;flex-direction:column;padding:20px}
.m-drawer.open{pointer-events:auto}.m-drawer.open .scrim{opacity:1}.m-drawer.open .m-panel{transform:none}
.m-panel .ml{display:flex;align-items:center;justify-content:space-between;padding:15px 6px;font-weight:600;font-size:16px;border-bottom:1px solid var(--line);width:100%;text-align:left;background:none}
footer.site-ft{background:var(--g950);color:#A9BEB2}
.ft-grid{display:grid;grid-template-columns:1.5fr 1fr 1fr 1.1fr;gap:40px;padding:64px 0 44px}
.ft-grid h4{color:#fff;font:700 13px var(--sans);letter-spacing:.12em;text-transform:uppercase;margin-bottom:16px}
.ft-grid a,.ft-grid .nl{display:block;font-size:14.5px;padding:5px 0;color:#A9BEB2;background:none;text-align:left}
.ft-grid a:hover,.ft-grid .nl:hover{color:var(--gold)}
.ft-brand p{font-size:14px;max-width:300px;margin-top:14px;line-height:1.6}
.ft-pay{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.ft-pay span{font-size:12px;font-weight:700;border:1px solid #2A4A3B;border-radius:99px;padding:5px 11px;color:#D8E5DC}
.ft-legal{border-top:1px solid #16352A;padding:20px 0;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:13px;color:#7E988B}
/* ============ HOME ============ */
.hero{padding:66px 0 84px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(700px 340px at 84% 6%,rgba(255,200,61,.16),transparent 65%);pointer-events:none}
.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:center;position:relative}
.hero h1{font-size:clamp(40px,5.4vw,66px);letter-spacing:-.022em;line-height:1.03;margin:20px 0 18px}
.hero h1 em{font-style:italic;color:var(--g700)}
.hero .lede{font-size:18px;color:var(--ink2);max-width:500px;margin-bottom:28px}
.hero-ctas{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.fee-note{font-size:13.5px;color:var(--ink2);max-width:480px;border-left:3px solid var(--gold);padding-left:14px;margin-bottom:22px}
.trust-row{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;font-weight:700;color:var(--ink2);align-items:center}
.trust-row .nets{display:inline-flex;gap:6px;align-items:center}
.trust-row .nets i{width:10px;height:10px;border-radius:3px;display:inline-block}
.hero-visual{position:relative;display:flex;justify-content:center;padding:12px 0 26px}
.phone{width:min(310px,86vw);background:#fff;border:9px solid var(--g950);border-radius:40px;box-shadow:var(--sh3);overflow:hidden;position:relative;z-index:2;transform:rotate(-1.4deg)}
.ph-status{display:flex;justify-content:space-between;align-items:center;padding:10px 18px 6px;font-size:11px;font-weight:700;color:var(--ink)}
.ph-status .bars{letter-spacing:1.5px}
.ph-hd{display:flex;gap:10px;align-items:center;padding:8px 14px 10px;border-bottom:1px solid var(--line)}
.ph-avatar{width:38px;height:38px;border-radius:11px;background:var(--gold);color:var(--g900);display:grid;place-items:center;font:700 15px var(--disp);flex:none}
.ph-hd b{font-size:14px;display:block;line-height:1.2}
.ph-hd small{font-size:11px;color:var(--g700);font-weight:700;display:flex;gap:5px;align-items:center}
.ph-tabs{display:flex;gap:14px;padding:9px 14px;border-bottom:1px solid var(--line);font-size:12px;font-weight:700;color:var(--ink3)}
.ph-tabs span.on{color:var(--g900);border-bottom:2px solid var(--gold);padding-bottom:6px}
.ph-row{display:flex;gap:10px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line)}
.ph-tile{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;color:var(--g900);flex:none}
.ph-row .t{flex:1;min-width:0}.ph-row .t b{font-size:12.5px;display:block}.ph-row .t small{font-size:10.5px;color:var(--ink3)}
.ph-row .pr{font-size:12.5px;font-weight:800}
.ph-add{width:28px;height:28px;border-radius:8px;background:var(--g900);color:#fff;display:grid;place-items:center;flex:none}
.ph-cart{display:flex;justify-content:space-between;align-items:center;background:var(--g900);color:#fff;margin:10px;border-radius:12px;padding:11px 14px;font-size:12.5px;font-weight:700}
.ph-cart b{color:var(--gold)}
.float-pay{position:absolute;z-index:3;right:max(-6px,4%);top:-8px;background:var(--g950);color:#fff;border-radius:13px;padding:12px 15px;box-shadow:var(--sh3);display:flex;gap:10px;align-items:center;animation:floaty 5s ease-in-out infinite;transform:rotate(1.6deg)}
.float-pay .amt{font-weight:800;font-size:14.5px}.float-pay .sub{font-size:11.5px;color:#9FB8AB}
.float-recv{position:absolute;z-index:3;left:max(-6px,2%);bottom:-6px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh2);padding:11px 14px;font-size:12px;animation:floaty 6s ease-in-out infinite reverse;transform:rotate(-1.5deg)}
.float-recv b{display:block;font-size:15px;color:var(--g700)}
@keyframes floaty{0%,100%{translate:0 0}50%{translate:0 -9px}}
.sell-band{background:var(--g900);color:#fff;padding:52px 0}
.sell-band h2{color:#fff;font-size:clamp(24px,3vw,34px);max-width:640px}
.sell-band p{color:#B9CEC2;max-width:560px;margin-top:10px}
.biz-chips{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
.biz-chips .chip{background:rgba(255,255,255,.06);border-color:#26503E;color:#E4EFE8}
.how-grid{display:grid;grid-template-columns:360px 1fr;gap:64px;align-items:start}
.how-sticky{position:sticky;top:110px}
.how-sticky h2{font-size:clamp(28px,3.4vw,40px);margin:14px 0 16px}
.how-row{display:grid;grid-template-columns:1fr;gap:14px;padding:30px 0;border-top:1px solid var(--line)}
.how-row:last-child{border-bottom:1px solid var(--line)}
.how-step{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-700)}
.how-row h3{font-size:22px}
.how-row p{color:var(--ink2);max-width:540px}
.how-mock{margin-top:6px}
.mm-pill{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line2);border-radius:9px;padding:9px 14px;font-weight:700;font-size:14px;box-shadow:var(--sh1)}
.mm-pill .dot{background:var(--g600)}
.mm-prompt{background:#fff;border:1px solid var(--line);border-radius:13px;box-shadow:var(--sh2);padding:16px 18px;max-width:300px}
.mm-prompt .dots{display:flex;gap:8px;margin:10px 0}
.mm-prompt .dots i{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--line2)}
.mm-prompt .dots i.f{background:var(--g900);border-color:var(--g900)}
.mm-row{display:flex;justify-content:space-between;gap:12px;font-size:13.5px;padding:6px 0}
.bento{display:grid;grid-template-columns:repeat(6,1fr);gap:16px}
.bcell{border-radius:14px;padding:26px;overflow:hidden}
.b-r3{grid-column:span 3;background:#fff;border:1px solid var(--line)}
.b-r2{grid-column:span 2;background:#fff;border:1px solid var(--line)}
.b-gold{background:var(--gold);border-color:var(--gold)}
.b-green{background:var(--g900);border-color:var(--g900)}
.bcell h3{font-size:20px;margin:14px 0 7px}
.b-green h3{color:#fff} .b-gold h3{color:var(--g950)}
.bcell p{font-size:14px;color:var(--ink2);max-width:380px}
.b-green p{color:#B9CEC2} .b-gold p{color:#5C470A}
.bico{width:42px;height:42px;border-radius:10px;display:grid;place-items:center}
.b-r3 .bico,.b-r2 .bico{background:var(--g50);color:var(--g700)}
.b-green .bico{background:rgba(255,200,61,.14);color:var(--gold)}
.b-gold .bico{background:rgba(11,46,33,.1);color:var(--g950)}
.mini-mock{margin-top:18px}
.mini-tgl{display:flex;align-items:center;gap:12px;background:var(--warm);border:1px solid var(--line);border-radius:10px;padding:10px 13px;font-size:13.5px;font-weight:700}
.price-grid{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:start}
.price-item{display:flex;gap:20px;padding:24px 0;border-bottom:1px solid var(--line)}
.price-item .num{font:600 40px var(--disp);color:var(--g900);min-width:150px;letter-spacing:-.02em}
.price-item .num small{font-size:15px;font-family:var(--sans);font-weight:600;color:var(--ink3);display:block;margin-top:2px}
.price-item h4{font:700 16px var(--sans);margin-bottom:4px}
.price-item p{color:var(--ink2);font-size:14px}
.receipt{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh2);overflow:hidden;position:sticky;top:100px}
.receipt-hd{background:var(--g950);color:#fff;padding:14px 22px;display:flex;justify-content:space-between;align-items:center;font-weight:800;letter-spacing:.14em;font-size:13px}
.receipt-bd{padding:22px}
.amt-chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 18px}
.tear{border-top:2px dashed var(--line2);margin:14px 0}
.stamp{display:inline-block;font:800 14px var(--sans);letter-spacing:.2em;color:var(--g700);border:2.5px solid var(--g700);border-radius:8px;padding:5px 16px;transform:rotate(-6deg)}
.agent-split{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center}
.ref-card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh2);padding:24px}
.ref-code{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1.5px dashed var(--line2);border-radius:10px;padding:12px 15px;background:var(--warm);margin:10px 0 16px}
.ref-code b{font-size:14.5px;word-break:break-all}
.cta-band{background:var(--g900);border-radius:20px;padding:60px;position:relative;overflow:hidden}
.cta-band::before{content:"";position:absolute;inset:0;background:radial-gradient(420px 220px at 88% 115%,rgba(255,200,61,.18),transparent)}
.cta-band h2{color:#fff;font-size:clamp(28px,3.4vw,44px)}
.name-box{background:#fff;border-radius:14px;padding:24px;max-width:460px;box-shadow:var(--sh3);position:relative;margin-top:30px}
details.acc{border-bottom:1px solid var(--line)}
details.acc summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:18px 2px;font-weight:700;font-size:15.5px;cursor:pointer}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary .ic{transition:transform .2s;color:var(--ink3);flex:none}
details.acc[open] summary .ic{transform:rotate(180deg)}
details.acc .acc-body{padding:0 2px 18px;color:var(--ink2);font-size:14.5px;max-width:680px}
/* ============ AUTH / STATUS ============ */

function toast(msg,type){const t=document.createElement("div");t.className="toast"+(type==="err"?" err":"");t.innerHTML=ic(type==="err"?"alert":"checkC",18)+`<span>${msg}</span>`;$("#toasts").appendChild(t);setTimeout(()=>{t.classList.add("out");setTimeout(()=>t.remove(),320)},3000)}
function openModal(html){closeModal();const o=document.createElement("div");o.className="overlay";o.innerHTML=`<div class="modal" role="dialog" aria-modal="true">${html}</div>`;o.addEventListener("click",e=>{if(e.target===o)closeModal()});$("#modal-root").appendChild(o)}
function closeModal(){$$("#modal-root .overlay").forEach(n=>n.remove())}
function openDrawer(html){closeDrawer();const o=document.createElement("div");o.className="drawer-ov";o.innerHTML=`<div class="drawer" role="dialog" aria-modal="true">${html}</div>`;o.addEventListener("click",e=>{if(e.target===o)closeDrawer()});$("#modal-root").appendChild(o)}
function closeDrawer(){$$("#modal-root .drawer-ov").forEach(n=>n.remove())}
function confirmDlg({title,body,cta="Confirm",danger=false,ok}){openModal(`<h3>${title}</h3><p class="m-body">${body}</p><div class="m-actions"><button class="btn btn-outline btn-sm" data-action="modal-close">Cancel</button><button class="btn ${danger?"btn-danger":"btn-dark"} btn-sm" id="confirm-ok">${cta}</button></div>`);$("#confirm-ok").onclick=()=>{closeModal();ok&&ok()}}
function copyText(txt,label){const done=()=>toast((label||"Text")+" copied");if(navigator.clipboard?.writeText){navigator.clipboard.writeText(txt).then(done).catch(()=>fb(txt,done))}else fb(txt,done)}
function fb(txt,done){const ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");done()}catch(e){toast("Couldn't copy","err")}ta.remove()}
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeModal();closeDrawer();$$(".pop.open").forEach(p=>p.classList.remove("open"))}});

/* =====================================================================
   ROUTER
   ===================================================================== */
function render(){
  const h=location.hash||"#/";let html="";
  const on=(re,fn)=>{if(re.test(h)){html=fn();return true}return false};
  if(/^#\/?$/.test(h)) html=vHome();
  else if(on(/^#\/login$/,vLogin)){}
  else if(on(/^#\/forgot$/,()=>vForgot(false))){}
  else if(on(/^#\/forgot-sent$/,()=>vForgot(true))){}
  else if(on(/^#\/reset$/,vReset)){}
  else if(on(/^#\/register$/,vRegister)){}
  else if(on(/^#\/status\/(pending|success|error)$/,()=>vStatus(h.split("/")[2]))){}
  else if(on(/^#\/404$/,v404)){}
  else if(on(/^#\/error$/,vError)){}
  else if(on(/^#\/store$/,vStoreHome)){}
  else if(on(/^#\/store\/products$/,vStoreProducts)){}
  else if(on(/^#\/store\/product\/([^/]+)$/,()=>vProduct(h.split("/")[3]))){}
  else if(on(/^#\/store\/cart$/,vCart)){}
  else if(on(/^#\/store\/checkout$/,vCheckout)){}
  else if(on(/^#\/store\/confirmed$/,vConfirmed)){}
  else if(on(/^#\/vendor$/,vVendor)){}
  else if(on(/^#\/vendor\/orders$/,vOrders)){}
  else if(on(/^#\/vendor\/products\/new$/,vProductNew)){}
  else if(on(/^#\/vendor\/products$/,vProducts)){}
  else if(on(/^#\/vendor\/storefront$/,vStorefrontPg)){}
  else if(on(/^#\/vendor\/payments$/,vPayments)){}
  else if(on(/^#\/vendor\/settings$/,vSettings)){}
  else if(on(/^#\/agent$/,vAgent)){}
  else if(on(/^#\/agent\/referrals$/,vReferrals)){}
  else if(on(/^#\/agent\/earnings$/,vEarnings)){}
  else if(on(/^#\/agent\/profile$/,vAgentProfile)){}
  else if(on(/^#\/admin$/,vAdmin)){}
  else if(on(/^#\/admin\/vendors$/,vAdminVendors)){}
  else if(on(/^#\/admin\/agents$/,vAdminAgents)){}
  else if(on(/^#\/admin\/orders$/,vAdminOrders)){}

function afterRender(){
  const sb=$("#sideBtn");if(sb){const mq=matchMedia("(max-width:980px)");const f=()=>sb.style.display=mq.matches?"grid":"none";f();mq.addEventListener?.("change",f)}
}
function syncRadios(){$$("label.radio-card input").forEach(i=>i.closest("label").classList.toggle("sel",i.checked))}
function goSection(id){
  const el=document.getElementById(id);
  if(el){el.scrollIntoView({behavior:RM?"auto":"smooth"})}
  else{location.hash="#/";setTimeout(()=>document.getElementById(id)?.scrollIntoView({behavior:RM?"auto":"smooth"}),60)}
}
window.addEventListener("hashchange",render);
addEventListener("scroll",()=>{const hd=$("#siteHd");if(hd)hd.classList.toggle("scrolled",scrollY>8)},{passive:true});

/* =====================================================================
   EVENTS
   ===================================================================== */
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-action]");
  if(!e.target.closest(".pop-wrap"))$$(".pop.open").forEach(p=>p.classList.remove("open"));
  if(!el)return;
  const a=el.dataset.action;
  switch(a){
    case "pop":{e.preventDefault();$("#pop-"+el.dataset.pop)?.classList.toggle("open");break}
    case "goto":{goSection(el.dataset.target);break}
    case "m-open":{if(!$("#mDrawer")){const d=document.createElement("div");d.className="m-drawer";d.id="mDrawer";
      d.innerHTML=`<div class="scrim" data-action="m-close"></div><div class="m-panel">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">${brand(false)}<button class="icon-btn" data-action="m-close" aria-label="Close menu">${ic("x",18)}</button></div>
        ${["how|How it works","features|Features","pricing|Pricing","agents|Agents","faq|FAQ"].map(x=>{const[t,l]=x.split("|");return `<button class="ml" data-action="m-goto" data-target="${t}">${l}${ic("chevR",16)}</button>`}).join("")}
        <a class="ml" href="#/login" data-action="m-close-x">Log in ${ic("chevR",16)}</a>
        <div style="margin-top:auto;padding-top:20px"><a class="btn btn-gold btn-block" href="#/register" data-action="m-close-x">Get my shop</a></div></div>`;
      document.body.appendChild(d);requestAnimationFrame(()=>d.classList.add("open"))}else{$("#mDrawer").classList.add("open")}break}
    case "m-close":{$("#mDrawer")?.classList.remove("open");break}
    case "m-close-x":{$("#mDrawer")?.classList.remove("open");break}
    case "m-goto":{$("#mDrawer")?.classList.remove("open");goSection(el.dataset.target);break}
    case "side-open":{$("#side").classList.add("open");$("#sideBd").classList.add("show");break}
    case "side-close":{$("#side").classList.remove("open");$("#sideBd").classList.remove("show");break}
    case "eye":{const inp=el.parentElement.querySelector("input");const show=inp.type==="password";inp.type=show?"text":"password";el.innerHTML=ic(show?"eyeOff":"eye",18);break}
    case "copy":{copyText(el.dataset.copy,el.dataset.label||"Text");break}
    case "toast":{toast(el.dataset.toast);break}
    case "modal-close":{closeModal();break}
    case "drawer-close":{closeDrawer();break}
    case "share-store":{copyText("https://mamajollof.seepay.shop","Shop link");break}
    case "seed-register":{const v=$("#seedName").value.trim();if(v){S.seedName=v;S.reg={shop:v,sub:v.toLowerCase().replace(/[^a-z0-9]/g,"")}}location.hash="#/register";break}
    case "calc":{S.calcAmt=+el.dataset.amt;updateCalc();break}
    /* store */
    case "add-cart":{const id=el.dataset.id;S.cart[id]=(S.cart[id]||0)+1;el.classList.add("added");el.innerHTML=ic("check",17);setTimeout(()=>{el.classList.remove("added");el.innerHTML=ic("plus",17)},900);
      const b=$("#cartBadge");if(b){b.style.display="grid";b.textContent=cartCount();b.classList.remove("bump");void b.offsetWidth;b.classList.add("bump")}
      toast(PRODUCTS.find(p=>p.id===id).name+" added to cart");break}
    case "add-cart-detail":{const q=parseInt($("#qtyVal").textContent)||1;const id=el.dataset.id;S.cart[id]=(S.cart[id]||0)+q;
      const b=$("#cartBadge");if(b){b.style.display="grid";b.textContent=cartCount();b.classList.remove("bump");void b.offsetWidth;b.classList.add("bump")}
      const old=el.innerHTML;el.innerHTML=ic("check",17)+" Added";setTimeout(()=>el.innerHTML=old,1100);
      toast(q+" × "+PRODUCTS.find(p=>p.id===id).name+" added to cart");break}
    case "qty":{const s=$("#qtyVal");s.textContent=Math.max(1,Math.min(9,(parseInt(s.textContent)||1)+ +el.dataset.d));break}
    case "cat":{S.storeCat=el.dataset.cat;S.skel=true;render();setTimeout(()=>{S.skel=false;render()},RM?50:420);break}
    case "clear-store":{S.storeQ="";S.storeCat="all";render();break}
    case "cart-qty":{const id=el.dataset.id;S.cart[id]=(S.cart[id]||0)+ +el.dataset.d;if(S.cart[id]<=0)delete S.cart[id];render();break}
    case "cart-del":{delete S.cart[el.dataset.id];render();toast("Item removed");break}
    case "pay":{
      let bad=false;
      [["c-name",v=>!v],["c-phone",v=>!/^0\d{9}$/.test(v.replace(/\s/g,""))],["c-wallet",v=>!/^0\d{9}$/.test(v.replace(/\s/g,""))]].forEach(([id,test])=>{
        const f=$("#"+id);if(!f)return;const inv=test(f.value.trim());f.closest(".field").classList.toggle("error",inv);if(inv)bad=true});
      if(bad){toast("Please fix the highlighted fields","err");return}
      const btn=el;btn.disabled=true;btn.innerHTML=`<span class="spin dark"></span> Sending prompt…`;
      openModal(`<div style="text-align:center"><h3>Pay Mama Jollof — GHS ${el.dataset.amt}</h3>
        <p class="m-body" style="margin-top:6px">Enter your MoMo PIN on the prompt sent to <b>${$("#c-wallet").value}</b>.</p>
        <div class="pin-dots"><i class="f"></i><i class="f"></i><i></i><i></i></div>
        <div style="display:flex;justify-content:center"><span class="spin dark" style="width:30px;height:30px;border-width:3px"></span></div></div>`);
      setTimeout(()=>{closeModal();S.cart={};location.hash="#/store/confirmed";toast("Payment approved — order placed")},RM?400:2200);
      break}
    /* auth / register */
    case "login":{let bad=false;["l-email","l-pass"].forEach(id=>{const f=$("#"+id);const inv=!f.value.trim();f.closest(".field").classList.toggle("error",inv);if(inv)bad=true});
      if(bad){toast("Enter your email and password","err");return}
      toast("Welcome back — opening your shop dashboard");location.hash="#/vendor";break}
    case "forgot-send":{const f=$("#f-email");if(!f.value.trim()){f.closest(".field").classList.add("error");return}location.hash="#/forgot-sent";break}
    case "reset-save":{let bad=false;const p1=$("#np1"),p2=$("#np2");
      p1.closest(".field").classList.toggle("error",p1.value.length<8);if(p1.value.length<8)bad=true;
      p2.closest(".field").classList.toggle("error",p2.value!==p1.value||!p2.value);if(p2.value!==p1.value||!p2.value)bad=true;
      if(bad){toast("Check the highlighted fields","err");return}
      toast("Password updated");location.hash="#/login";break}
    case "reg-next":{
      if(S.regStep===1){
        const shop=$("#r-shop"),sub=$("#r-sub"),cat=$("#r-cat"),ref=$("#r-ref");let bad=false;
        shop.closest(".field").classList.toggle("error",!shop.value.trim());if(!shop.value.trim())bad=true;
        const subOk=/^[a-z0-9]{3,20}$/.test(sub.value.trim());sub.closest(".field").classList.toggle("error",!subOk);if(!subOk)bad=true;
        cat.closest(".field").classList.toggle("error",!cat.value);if(!cat.value)bad=true;
        if(bad){toast("Please complete the highlighted fields","err");return}
        S.reg={...S.reg,shop:shop.value.trim(),sub:sub.value.trim().toLowerCase(),cat:cat.value,ref:ref.value.trim().toUpperCase()};S.regStep=2;render();
      }else{
        const name=$("#r-name"),email=$("#r-email"),phone=$("#r-phone"),pass=$("#r-pass"),terms=$("#r-terms");let bad=false;
        const chk=(f,cond)=>{f.closest(".field").classList.toggle("error",cond);if(cond)bad=true};
        chk(name,!name.value.trim());chk(email,!/^\S+@\S+\.\S+$/.test(email.value.trim()));
        chk(phone,!/^0\d{9}$/.test(phone.value.replace(/\s/g,"")));chk(pass,pass.value.length<8);
        terms.closest(".field").classList.toggle("error",!terms.checked);if(!terms.checked)bad=true;
        if(bad){toast("Please complete the highlighted fields","err");return}
        S.reg={...S.reg,name:name.value.trim(),email:email.value.trim(),phone:phone.value.trim(),password:pass.value};S.regStep=3;render();
      }break}
    case "reg-back":{S.regStep=Math.max(1,S.regStep-1);render();break}
    case "reg-pay":{toast("Sending MoMo prompt…");setTimeout(()=>location.hash="#/status/pending",RM?200:900);break}
    case "fake-check":{el.innerHTML=`<span class="spin dark"></span> Checking…`;setTimeout(()=>location.hash="#/status/success",RM?300:1400);break}
    case "confirm-cancel":{confirmDlg({title:"Cancel registration?",body:"Your shop details will be kept for 7 days so you can resume anytime. No payment has been taken.",cta:"Yes, cancel",danger:true,ok:()=>{toast("Registration cancelled");location.hash="#/"}});break}
    /* vendor */
    case "order-tab":{S.orderTab=el.dataset.tab;render();break}
    case "open-order":{const o=ORDERS.find(x=>x.id===el.dataset.id);openDrawer(orderDrawer(o));break}
    case "fulfil":{confirmDlg({title:"Mark "+el.dataset.id+" as fulfilled?",body:"The customer will be notified their order is ready. Payout settles per the usual payment split.",cta:"Mark fulfilled",ok:()=>{const o=ORDERS.find(x=>x.id===el.dataset.id);o.st="fulfilled";closeDrawer();render();toast(el.dataset.id+" marked fulfilled 🎉")}});break}
    case "toggle-prod":{el.classList.toggle("on");toast(el.dataset.name+(el.classList.contains("on")?" is back on your shop":" is hidden from your shop"));break}
    case "del-prod":{confirmDlg({title:"Delete "+el.dataset.name+"?",body:"This removes it from your shop immediately. Past orders keep their records.",cta:"Delete product",danger:true,ok:()=>toast(el.dataset.name+" deleted")});break}
    case "clear-vprod":{S.vendorProdQ="";render();break}
    case "upload":{el.classList.add("done");el.innerHTML=ic("checkC",26)+'<div style="margin-top:8px"><b>jollof-hero.jpg added</b><br><span class="xs">Click to add more</span></div>';toast("Photo added");break}
    case "save-product":{
      let bad=false;
      [["np-name",v=>!v],["np-desc",v=>!v],["np-cat",v=>!v],["np-price",v=>!(+v>0)],["np-stock",v=>v===""||+v<0]].forEach(([id,test])=>{
        const f=$("#"+id);const inv=test(f.value.trim());f.closest(".field").classList.toggle("error",inv);if(inv)bad=true});
      if(bad){toast("Please complete the highlighted fields","err");return}
      toast("Product saved & published 🎉");location.hash="#/vendor/products";break}
    case "save-payout":{let bad=false;["pw-num","pw-name"].forEach(id=>{const f=$("#"+id);const inv=!f.value.trim()||(id==="pw-num"&&!/^0\d{9}$/.test(f.value.replace(/\s/g,"")));f.closest(".field").classList.toggle("error",inv);if(inv)bad=true});
      if(bad){toast("Check the highlighted fields","err");return}toast("Payout details saved");break}
    case "settings-tab":{S.settingsTab=el.dataset.tab;render();break}
    case "save-settings":{toast("Settings saved");break}
    case "chip-toggle":{el.classList.toggle("on");toast("Delivery areas updated");break}
    case "confirm-close-shop":{confirmDlg({title:"Close Mama Jollof?",body:"Your shop will be hidden and ordering paused until you reopen it.",cta:"Close shop",danger:true,ok:()=>toast("Your shop is now hidden")});break}
    /* agent */
    case "payout-modal":{openModal(`<h3>Request a payout</h3><p class="m-body" style="margin-bottom:16px">Available balance: <b>GH₵ 250.00</b> · minimum GH₵ 50.00</p>
      <div class="field"><label>Amount (GH₵)</label><input class="input" id="po-amt" type="number" min="50" max="250" placeholder="50.00"><div class="ferr">${ic("alert",14)} Enter an amount between GH₵50 and GH₵250</div></div>
      <div class="field"><label>Send to</label><select class="input"><option>MTN MoMo · 024 811 2203</option><option>Add a different wallet…</option></select></div>
      <div class="m-actions"><button class="btn btn-outline btn-sm" data-action="modal-close">Cancel</button><button class="btn btn-gold btn-sm" id="po-submit">${ic("wallet",15)} Request payout</button></div>`);
      $("#po-submit").onclick=()=>{const f=$("#po-amt");const v=+f.value;const inv=!(v>=50&&v<=250);f.closest(".field").classList.toggle("error",inv);
        if(inv)return;closeModal();toast("Payout of "+money(v)+" requested — processing");};
      break}
    /* admin */
    case "admin-vendor":{const v=ADMIN_VENDORS.find(x=>x.name===el.dataset.name);
      openDrawer(`<div class="drawer-hd"><div><b>${v.name}</b><br><span class="xs muted">${v.addr}.seepay.shop</span></div><button class="icon-btn" data-action="drawer-close" aria-label="Close">${ic("x",17)}</button></div>
      <div class="drawer-bd">
        <div style="display:flex;gap:8px;margin-bottom:16px">${badge(v.st)}<span class="badge b-gray">${v.cat}</span></div>
        <div class="card pad" style="background:var(--warm);margin-bottom:16px">
          <div class="sum-row"><span>Owner</span><b>${v.owner}</b></div>
          <div class="sum-row"><span>Joined</span><b>${v.joined}</b></div>
          <div class="sum-row"><span>Orders</span><b>${v.orders}</b></div>
          <div class="sum-row"><span>GMV</span><b class="mono">${money(v.gmv)}</b></div>
          <div class="sum-row"><span>Setup status</span><b>${v.st==="active"?"Active":v.st==="pending"?"Payment/activation pending":"Not active"}</b></div></div>
        <div class="m-actions" style="justify-content:stretch">
          <a class="btn btn-outline btn-sm" style="flex:1" href="#/store">${ic("ext",15)} View storefront</a>
          ${v.st==="pending"?`<button class="btn btn-gold btn-sm" style="flex:1" data-action="approve-vendor" data-name="${v.name}">Confirm activation</button>`:""}
          ${v.st==="active"?`<button class="btn btn-danger btn-sm" style="flex:1" data-action="suspend-vendor" data-name="${v.name}">Suspend</button>`:""}
          ${v.st==="suspended"?`<button class="btn btn-dark btn-sm" style="flex:1" data-action="reinstate-vendor" data-name="${v.name}">Reinstate</button>`:""}
        </div></div>`);break}
    case "approve-vendor":{const v=ADMIN_VENDORS.find(x=>x.name===el.dataset.name);if(v)v.st="active";closeDrawer();render();toast(el.dataset.name+" activated ✓");break}
    case "suspend-vendor":{confirmDlg({title:"Suspend "+el.dataset.name+"?",body:"The storefront will be hidden and checkout disabled until reinstated. The owner is notified.",cta:"Suspend vendor",danger:true,ok:()=>{const v=ADMIN_VENDORS.find(x=>x.name===el.dataset.name);if(v)v.st="suspended";closeDrawer();render();toast(el.dataset.name+" suspended")}});break}
    case "reinstate-vendor":{confirmDlg({title:"Reinstate "+el.dataset.name+"?",body:"The storefront becomes visible again and customers can order.",cta:"Reinstate",ok:()=>{const v=ADMIN_VENDORS.find(x=>x.name===el.dataset.name);if(v)v.st="active";closeDrawer();render();toast(el.dataset.name+" reinstated")}});break}
    case "approve-payout":{confirmDlg({title:"Mark PO-121 as paid?",body:"Confirms GH₵100.00 was sent to Efua Owusu's MTN MoMo wallet.",cta:"Mark paid",ok:()=>{$("#po121").innerHTML=badge("paid");el.remove();toast("PO-121 marked paid")}});break}
    case "av-st":{S.adminVSt=el.dataset.st;render();break}
  }
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="storeSearch"){S.storeQ=t.value;refreshStoreGrid()}
  else if(t.id==="storeSort"){S.storeSort=t.value;refreshStoreGrid()}
  else if(t.id==="vprodSearch"){S.vendorProdQ=t.value;render();const f=$("#vprodSearch");f.focus();f.setSelectionRange(f.value.length,f.value.length)}
  else if(t.id==="avq"){S.adminVQ=t.value;render();const f=$("#avq");f.focus();f.setSelectionRange(f.value.length,f.value.length)}
  else if(t.id==="r-sub"){const prev=$("#subPrev");const v=t.value.toLowerCase().replace(/[^a-z0-9]/g,"");t.value=v;
    if(prev)prev.innerHTML=v?`Preview: <b>${v}.seepay.shop</b>`:"Letters and numbers, 3–20 characters."}
  else if(t.id==="seedName"){const v=t.value.trim().toLowerCase().replace(/[^a-z0-9]/g,"");
    const p=$("#seedPrev");if(p)p.textContent=(v||"yourshop")+".seepay.shop"}
  else if(t.id==="calcInput"){const v=Math.max(1,+t.value||1);S.calcAmt=v;updateCalc(true)}
  else if(t.id==="np-price"){const p=$("#prevPrice");if(p)p.textContent=t.value?money(+t.value):"GH₵ —"}
  else if(t.id==="np1"){const lbl=$("#pwlabel");const v=t.value;
    lbl.textContent=v.length>=12&&/\d/.test(v)&&/[a-zA-Z]/.test(v)?"Strong":v.length>=8?"Good":"Too short";
    lbl.style.color=v.length>=8?"var(--g700)":"var(--red-d)"}
  else if(t.closest(".field.error")){t.closest(".field").classList.remove("error")}
});
function updateCalc(keepInput){
  const a=S.calcAmt, ps=psFee(a);
  $("#cTotal").textContent=money(r2(a));
  $("#cPs").textContent="− "+ps.toFixed(2);
  $("#cRecv").textContent=money(recv(a));
  if(!keepInput&&$("#calcInput"))$("#calcInput").value=a;
  $$(".amt-chips .chip").forEach(c=>c.classList.toggle("on",+c.dataset.amt===a));
}
function refreshStoreGrid(){
  const grid=$("#ptGrid");if(!grid)return;
  let list=PRODUCTS.filter(p=>(S.storeCat==="all"||p.cat===S.storeCat)&&p.name.toLowerCase().includes(S.storeQ.toLowerCase()));
  if(S.storeSort==="low")list=[...list].sort((a,b)=>a.price-b.price);
  if(S.storeSort==="high")list=[...list].sort((a,b)=>b.price-a.price);
  const rc=$("#resultCount");if(rc)rc.textContent=`${list.length} item${list.length===1?"":"s"}`;
  grid.innerHTML=list.length?list.map(productCard).join("")
    :`<div class="empty" style="grid-column:1/-1"><div class="eico">${ic("search",30)}</div><h3>Nothing matches “${S.storeQ}”</h3><p>Try a different search, or see the whole menu.</p><button class="btn btn-dark" data-action="clear-store">Clear search & filters</button></div>`;
}
if (!window.__SEEPAY_CONNECTED_UI__) render();
