<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#0B2E21"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;700&family=Hanken+Grotesk:wght@400;600&display=swap" rel="stylesheet"><style>
:root{--ink:#0B2E21;--green:#0E3B2C;--gold:#FFC83D;--red:#E4402F;--mint:#CFE9DB;
--pbg:#F2F7F3;--pfg:#0B2E21;--pcard:#fff;--pmut:#4b5f55;--pline:#d5e2da;--ok:#127a46;
--d:'Familjen Grotesk','Trebuchet MS',system-ui,sans-serif;--b:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--pbg:#0A1812;--pfg:#EAF3EE;--pcard:#12281d;--pmut:#9DB3A7;--pline:#24402F;--ok:#5fd699}}
html{background:var(--green);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:border-box;margin:0}
body{background:var(--pbg);color:var(--pfg);font:400 clamp(1rem,.96rem + .2vw,1.08rem)/1.6 var(--b);overflow-x:hidden}
h1,h2,h3{font-family:var(--d);line-height:1.04;letter-spacing:-.025em;font-weight:700}
a{color:inherit}:focus-visible{outline:3px solid var(--red);outline-offset:3px}
.wrap{width:min(1040px,100% - 2rem);margin-inline:auto}
.muted{color:var(--pmut)}

/* nav + buttons (same as landing) */
nav{position:fixed;top:0;left:0;right:0;z-index:30;height:calc(60px + env(safe-area-inset-top,0px));padding-top:env(safe-area-inset-top,0px);background:var(--ink);color:#fff}
nav .wrap{height:60px;display:flex;align-items:center;gap:1.4rem}
.logo{display:flex;align-items:center;gap:.6rem;text-decoration:none;font:700 1.35rem var(--d);letter-spacing:-.02em}
.logo svg{width:32px;height:32px}
.links{display:flex;gap:1.4rem;margin-left:auto;font-size:.95rem}
.links a{text-decoration:none;color:#ffffffcc}.links a:hover{color:#fff}
@media(max-width:760px){.links a:not(.btn){display:none}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.8rem 1.5rem;border-radius:12px;background:var(--ink);color:#fff;font:600 1rem var(--b);text-decoration:none;border:2px solid var(--ink);cursor:pointer;transition:background .2s,transform .2s}
.btn:hover{transform:translateY(-1px);background:#14543f}.btn:disabled{opacity:.6;cursor:wait;transform:none}
.btn.g{background:var(--gold);color:var(--ink);border-color:var(--gold)}.btn.g:hover{background:#ffd461}
.btn.w{background:transparent;color:var(--ink)}.btn.w:hover{background:#0b2e2114}
nav .btn{padding:.5rem 1rem;font-size:.92rem;border-radius:10px}
footer{background:var(--ink);color:#ffffffaa;padding:2rem 0;text-align:center;font-size:.92rem}

/* awning + gold stage */
.stage{position:relative;margin-top:calc(60px + env(safe-area-inset-top,0px));padding:calc(46px + 3rem) 0 4rem;background:var(--gold);color:var(--ink);min-height:calc(100svh - 60px - 5.5rem)}
.stage::before{content:"";position:absolute;inset:0;background:radial-gradient(#0b2e2120 1.4px,transparent 1.5px) 0 0/20px 20px;-webkit-mask:radial-gradient(70% 60% at 50% 100%,#000,transparent);mask:radial-gradient(70% 60% at 50% 100%,#000,transparent);pointer-events:none}
.awning{--w:40px;position:absolute;top:0;left:0;right:0;height:46px;z-index:2;background:repeating-linear-gradient(90deg,var(--red) 0 var(--w),#fff var(--w) calc(var(--w)*2));transform-origin:top;animation:drop .8s cubic-bezier(.3,1.35,.5,1) both}
.awning::after{content:"";position:absolute;left:0;right:0;top:100%;height:calc(var(--w)/2);background:inherit;-webkit-mask:radial-gradient(circle calc(var(--w)/2) at calc(var(--w)/2) 0,#000 calc(var(--w)/2 - .5px),transparent calc(var(--w)/2)) 0 0/var(--w) 100% repeat-x;mask:radial-gradient(circle calc(var(--w)/2) at calc(var(--w)/2) 0,#000 calc(var(--w)/2 - .5px),transparent calc(var(--w)/2)) 0 0/var(--w) 100% repeat-x;filter:drop-shadow(0 3px 4px #0b2e2133)}
.cols{position:relative;display:grid;gap:2rem;grid-template-columns:1fr;align-items:start}
@media(min-width:900px){.cols{grid-template-columns:5fr 6fr;gap:3.5rem}.cols .side{position:sticky;top:96px}}
.side h1{font-size:clamp(2.2rem,6vw,3.6rem);max-width:12ch}
.side p.sub{margin-top:1rem;max-width:36ch;font-weight:600;font-size:1.1rem}
.facts{list-style:none;padding:0;margin-top:1.4rem;display:grid;gap:.5rem;font-weight:600}
.facts li{display:flex;gap:.6rem;align-items:center}.facts svg{width:1.1em;height:1.1em;flex:none}
.sign{display:inline-block;margin-top:1.6rem;padding:.8rem 1.3rem;border-radius:14px;background:#fff;color:var(--ink);font:700 clamp(1.05rem,3.6vw,1.6rem) var(--d);word-break:break-all;box-shadow:0 18px 30px -18px #0b2e2188}
.sign u{text-decoration:none;color:var(--red)}

/* cards + forms */
.card{background:var(--pcard);color:var(--pfg);border-radius:20px;padding:clamp(1.2rem,3vw,2rem);box-shadow:0 24px 40px -20px #0b2e2166;display:grid;gap:1.1rem}
.card h2{font-size:1.5rem}
.fld{display:grid;gap:.35rem}.fld>label,.lab{font-weight:600;font-size:.95rem}
.fld small{color:var(--pmut);font-size:.85rem}
.in{width:100%;font:inherit;padding:.75rem .9rem;border:2px solid var(--pline);border-radius:12px;background:var(--pbg);color:inherit;transition:border-color .2s,box-shadow .2s}
.in:focus{outline:0;border-color:var(--ink);box-shadow:0 0 0 3px var(--gold)}
.in.bad{border-color:var(--red)}
.suf{display:flex;align-items:center;border:2px solid var(--pline);border-radius:12px;background:var(--pbg);padding-right:.9rem;transition:border-color .2s,box-shadow .2s}
.suf:focus-within{border-color:var(--ink);box-shadow:0 0 0 3px var(--gold)}
.suf .in{border:0;box-shadow:none;background:transparent;min-width:0}.suf span{color:var(--pmut);font-weight:600;white-space:nowrap}
.pills{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}
.pills input{position:absolute;opacity:0;pointer-events:none}
.pills label{display:flex;gap:.4rem;align-items:center;justify-content:center;padding:.7rem .3rem;border:2px solid var(--pline);border-radius:12px;font-weight:700;font-size:.92rem;cursor:pointer;transition:border-color .2s,background .2s,transform .15s}
.pills label::before{content:"";width:.7em;height:.7em;border-radius:50%;background:var(--c);border:1px solid #0003}
.pills label:active{transform:scale(.96)}
.pills input:checked+label{border-color:var(--ink);background:var(--mint);color:var(--ink)}
.pills input:focus-visible+label{outline:3px solid var(--red);outline-offset:2px}
.st{font-size:.88rem;font-weight:600;min-height:1.3em;display:flex;gap:.4rem;align-items:center}
.st.ok{color:var(--ok)}.st.no{color:var(--red)}
.err{background:#fbd5cf;color:#7a1f14;padding:.7rem .9rem;border-radius:12px;font-weight:600;animation:shake .4s}
.fine{font-size:.88rem;color:var(--pmut)}
.spin{width:1em;height:1em;border:2.5px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}

/* agent ticket + list */
.ticket{background:var(--gold);color:var(--ink);border-radius:20px;padding:1.5rem;display:grid;gap:1rem;box-shadow:0 24px 40px -20px #0b2e2166}
.code{font:600 .95rem var(--b);background:#ffffffcc;padding:.7rem .9rem;border-radius:10px;word-break:break-all}
.bal{font:700 clamp(2.8rem,8vw,4rem) var(--d);line-height:1}.bal small{display:block;font:600 .9rem var(--b);opacity:.75;margin-bottom:.3rem}
.tabs{display:flex;gap:.4rem;background:var(--pbg);padding:.3rem;border-radius:14px}
.tabs button{flex:1;padding:.6rem;border:0;border-radius:10px;font:600 .95rem var(--b);background:transparent;color:inherit;cursor:pointer;transition:background .2s}
.tabs button.on{background:var(--ink);color:#fff}
.list{list-style:none;padding:0;display:grid;gap:.5rem}
.list li{display:flex;justify-content:space-between;gap:1rem;align-items:center;padding:.8rem 1rem;border:1px solid var(--pline);border-radius:14px;animation:rise .5s cubic-bezier(.22,.61,.36,1) both;animation-delay:calc(var(--i)*70ms)}
.list b{display:block}.list span{font-size:.85rem;color:var(--pmut)}
.bd{font-size:.78rem;font-weight:700;padding:.2rem .7rem;border-radius:99px;background:#ffe9a8;color:#7a5400;white-space:nowrap}.bd.ok{background:#d9f2e3;color:#127a46}
.row{display:flex;gap:.6rem;flex-wrap:wrap}

/* done */
.done{text-align:center;justify-items:center}
.ring{width:84px;height:84px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;animation:pop .5s both}
.ring svg{width:46px;height:46px}.ring path{stroke-dasharray:30;stroke-dashoffset:30;animation:draw .5s .35s ease forwards}

/* storefront shell */
.store{width:min(640px,100% - 2rem);margin:3rem auto}.store h1{font-size:2.4rem;margin-bottom:1rem}
.plist{list-style:none;padding:0;display:grid;gap:.6rem}.plist li{display:flex;justify-content:space-between;gap:1rem;padding:.9rem 1rem;border:1px solid var(--pline);border-radius:14px;background:var(--pcard)}
.plist span{display:block;color:var(--pmut);font-size:.9rem}.plist em{font:700 1rem var(--d);font-style:normal}

/* motion: one load sequence, then responses to actions */
@keyframes drop{from{transform:scaleY(0)}to{transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.85);opacity:.3}60%{transform:scale(1.07)}100%{transform:none;opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.seq>*{animation:rise .6s cubic-bezier(.22,.61,.36,1) both;animation-delay:calc(380ms + var(--i,0)*80ms)}
.pop{display:inline-block;animation:pop .3s ease both}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition-duration:.01s!important}.ring path{stroke-dashoffset:0}}

/* ===== additions: owner portal, catalog, cart, sheets ===== */
[hidden]{display:none!important}
.stage.sm{min-height:0;margin-top:0;padding:calc(46px + 2.4rem) 0 1.6rem}
.dstage{margin-top:calc(60px + env(safe-area-inset-top,0px));background:var(--green);color:#fff;padding:1.4rem 0 1.6rem}
.hd{display:flex;gap:.8rem;align-items:center}.hd>div{min-width:0}
.hd b{font:700 1.35rem var(--d);display:block;line-height:1.1;overflow-wrap:anywhere}
.av{width:46px;height:46px;border-radius:50%;background:var(--green);color:var(--gold);display:grid;place-items:center;font:700 16px var(--d);box-shadow:0 0 0 2px #fff,0 0 0 4px var(--gold);flex:none}
.dstage .av{background:var(--ink)}
.chip{display:inline-flex;gap:.4rem;align-items:center;font:600 .85rem var(--b);padding:.3rem .8rem;border-radius:99px;background:#ffffff22;color:inherit;border:0;cursor:pointer;text-decoration:none}
.live{width:.55rem;height:.55rem;border-radius:50%;background:#3ddc84;display:inline-block}
.wal{margin-top:1rem;background:var(--ink);border-radius:16px;padding:1rem 1.2rem;display:flex;justify-content:space-between;align-items:end;gap:1rem}
.wal small{color:var(--mint);font-size:.88rem}.wal strong{display:block;font:700 2.3rem var(--d);line-height:1.1}
.body{width:min(760px,100% - 2rem);margin:1rem auto 4rem;display:grid;gap:1rem}
.body.wide{width:min(1040px,100% - 2rem)}
.tg{width:44px;height:26px;border-radius:99px;background:#b9c9c0;position:relative;border:0;cursor:pointer;flex:none;transition:background .2s}
.tg::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s}
.tg[aria-checked=true]{background:#1faa63}.tg[aria-checked=true]::after{transform:translateX(18px)}
.pr,.od{display:flex;gap:.8rem;align-items:center;padding:.7rem;border:1px solid var(--pline);border-radius:16px;background:var(--pcard);animation:rise .45s cubic-bezier(.22,.61,.36,1) both;animation-delay:calc(var(--i,0)*60ms)}
.pr{cursor:pointer}.pr>div{flex:1;min-width:0}.pr b{display:block}.pr span{font-size:.85rem;color:var(--pmut)}
.pr em,.od em{font:700 1.05rem var(--d);font-style:normal}
.pr .sold{opacity:.55}
.th{width:58px;height:58px;border-radius:12px;object-fit:cover;flex:none;display:grid;place-items:center;font:700 1.5rem var(--d);color:var(--ink)}
.od{display:block;padding:0}.od summary{display:flex;gap:.8rem;align-items:center;justify-content:space-between;padding:.8rem;cursor:pointer;list-style:none}
.od summary::-webkit-details-marker{display:none}.od summary::after{content:none}
.od .more{padding:0 .8rem .9rem;display:grid;gap:.6rem;border-top:1px dashed var(--pline);padding-top:.8rem}
.ln{display:flex;justify-content:space-between;gap:1rem;padding:.15rem 0}.ln.t{border-top:2px dashed var(--pline);margin-top:.4rem;padding-top:.5rem;font-weight:700}
.ov{position:fixed;inset:0;background:#0b2e21aa;z-index:50;display:none;align-items:flex-end;justify-content:center}.ov.on{display:flex}
.sheet{width:min(520px,100%);max-height:92svh;overflow:auto;background:var(--pcard);color:var(--pfg);border-radius:22px 22px 0 0;padding:1.3rem 1.3rem calc(1.3rem + env(safe-area-inset-bottom,0px));display:grid;gap:1rem;animation:up .32s cubic-bezier(.22,.61,.36,1)}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:22px}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.pick{display:grid;place-items:center;text-align:center;aspect-ratio:4/3;border:2px dashed var(--pline);border-radius:14px;background:var(--pbg) center/cover no-repeat;color:var(--pmut);font-weight:600;cursor:pointer;padding:1rem}
.pick.has{border-style:solid;color:transparent}
.btn.red{background:transparent;color:var(--red);border-color:transparent}
.btn.block{width:100%}
.empty{text-align:center;padding:2rem 1rem;color:var(--pmut);display:grid;gap:.8rem;justify-items:center}
.toast{position:fixed;left:50%;bottom:5.5rem;translate:-50% 0;background:var(--ink);color:#fff;padding:.7rem 1.1rem;border-radius:12px;z-index:70;font-weight:600;animation:rise .3s both}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:1rem}
.pc{background:var(--pcard);border:1px solid var(--pline);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;animation:rise .5s cubic-bezier(.22,.61,.36,1) both;animation-delay:calc(var(--i,0)*70ms)}
.pc .ph{aspect-ratio:4/3;width:100%;object-fit:cover;display:grid;place-items:center;font:700 3.4rem var(--d);color:var(--ink)}
.pc .in2{padding:.9rem 1rem 1rem;display:grid;gap:.25rem;flex:1;align-content:start}
.pc h3{font-size:1.12rem}.pc p{color:var(--pmut);font-size:.9rem}
.pc .ft{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:.7rem}
.pc em{font:700 1.25rem var(--d);font-style:normal}
.step{display:inline-flex;align-items:center;background:var(--ink);color:#fff;border-radius:99px}
.step button{width:40px;height:40px;border:0;background:transparent;color:inherit;font:600 1.3rem var(--b);cursor:pointer}
.step b{min-width:1.4rem;text-align:center}
.add{height:40px;padding:0 1.1rem;border-radius:99px;border:2px solid var(--ink);background:transparent;color:var(--pfg);font:600 .95rem var(--b);cursor:pointer;transition:background .2s,color .2s}
.add:hover{background:var(--ink);color:#fff}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:.8rem 1rem calc(.8rem + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;transform:translateY(120%);transition:transform .4s cubic-bezier(.3,1.3,.5,1)}
.bar.on{transform:none}.bar .btn{width:min(560px,100%);justify-content:space-between;box-shadow:0 14px 30px -10px #0b2e2188}
.cl{display:flex;gap:.7rem;align-items:center;justify-content:space-between}.cl b{display:block}
.pw{font-size:.82rem;text-align:center;color:var(--pmut);padding:1.5rem 0 5rem}

/* ===== polish pass: depth, icons, skeletons, detail ===== */
body{background:radial-gradient(900px 420px at 100% 0,#cfe9db66,transparent 60%),var(--pbg)}
.stage{background:linear-gradient(180deg,#FFD655,#FFC83D 55%,#FBBE2B)}
.stage.sm{border-radius:0 0 28px 28px}
.card{border:1px solid var(--pline);box-shadow:0 1px 2px #0b2e2114,0 24px 46px -24px #0b2e218c}
.in:hover{border-color:#9db9a9}
.btn{box-shadow:inset 0 1px 0 #ffffff2e,0 10px 18px -12px #0b2e21aa}
.btn.g{box-shadow:inset 0 1px 0 #fffa,0 12px 20px -12px #a97800}
.btn.w,.btn.red,.btn.block.w{box-shadow:none}
.btn:active{transform:translateY(1px) scale(.99)}
.ic{width:1.15em;height:1.15em;flex:none}
.ticket{background:linear-gradient(135deg,#FFD65C,#FFC83D 55%,#F7B91E);outline:1.5px dashed #0b2e2144;outline-offset:-9px}
.steps{display:flex;align-items:center;gap:.5rem;margin-top:1.3rem;font:600 .85rem var(--b);flex-wrap:wrap}
.steps .s{display:flex;align-items:center;gap:.4rem}
.steps i{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:#0b2e2122;font-style:normal;font-weight:700}
.steps i.on{background:var(--ink);color:#fff}.steps u{flex:0 0 20px;height:2px;background:#0b2e2133}
.trust{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1.2rem}
.trust span{display:inline-flex;gap:.4rem;align-items:center;font:600 .8rem var(--b);padding:.4rem .75rem;border-radius:99px;background:#ffffffb3;color:var(--ink)}
.how{list-style:none;padding:0;margin-top:1.5rem;display:grid;gap:.7rem}
.how li{display:flex;gap:.8rem;align-items:center;background:#ffffffa6;border-radius:14px;padding:.7rem .9rem;font-weight:600}
.how .n{width:36px;height:36px;border-radius:10px;background:var(--ink);color:var(--gold);display:grid;place-items:center;flex:none}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem}
.kpi{background:var(--pcard);border:1px solid var(--pline);border-radius:16px;padding:.8rem .9rem;display:grid;gap:.2rem;animation:rise .5s both;animation-delay:calc(var(--i,0)*70ms)}
.kpi small{color:var(--pmut);font-weight:600;font-size:.78rem;display:flex;gap:.35rem;align-items:center}
.kpi b{font:700 1.55rem var(--d);line-height:1.1}
.dstage .kpi{background:#ffffff14;border-color:#ffffff24;color:#fff}.dstage .kpi small{color:var(--mint)}
.stage .chip{background:#0b2e2114;color:var(--ink)}.dstage .chip{background:#ffffff22}
.av.lg{width:66px;height:66px;font-size:22px}
.hn{font-size:clamp(1.7rem,5.5vw,2.6rem)!important;letter-spacing:-.03em}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.55rem}
.sec{display:flex;justify-content:space-between;align-items:baseline;gap:1rem}.sec h2{font-size:1.5rem}.sec span{color:var(--pmut);font-weight:600;font-size:.9rem}
.sk{background:linear-gradient(90deg,#0b2e2110 25%,#0b2e2122 50%,#0b2e2110 75%);background-size:200% 100%;animation:sh 1.2s linear infinite;border-radius:10px}
.dstage .sk{background:#ffffff1c}
@keyframes sh{to{background-position:-200% 0}}
.empty svg{width:104px;height:104px}.empty b{color:var(--pfg);font:700 1.2rem var(--d)}
.tabs button{display:flex;align-items:center;justify-content:center;gap:.4rem}
.ct{font-style:normal;font-size:.72rem;background:#0b2e2118;padding:.05rem .5rem;border-radius:99px}.tabs button.on .ct{background:#ffffff33}
.body>.tabs{position:sticky;top:calc(64px + env(safe-area-inset-top,0px));z-index:10;box-shadow:0 10px 22px -16px #0b2e21aa}
.pc{transition:transform .25s,box-shadow .25s;box-shadow:0 1px 2px #0b2e2110}
.pc:hover{transform:translateY(-4px);box-shadow:0 26px 40px -24px #0b2e21aa}
.pc .pm{position:relative;overflow:hidden;aspect-ratio:4/3}
.pc .pm .ph{display:grid;aspect-ratio:auto;height:100%;transition:transform .5s}
.pc:hover .pm .ph{transform:scale(1.06)}
.pc .tag{position:absolute;left:.7rem;bottom:.7rem;background:#fff;color:var(--ink);font:700 1rem var(--d);padding:.28rem .75rem;border-radius:99px;box-shadow:0 8px 16px -8px #0b2e21aa}
.pc .ft{padding-top:.8rem}.pc .ft>span{width:100%}
.add{width:100%;display:flex;justify-content:center;align-items:center;gap:.4rem}
.step{width:100%;justify-content:space-between}
.bar .btn span:first-child{display:flex;gap:.5rem;align-items:center}
.pw{display:flex;gap:.5rem;justify-content:center;align-items:center}

footer{padding:2.2rem 0 calc(2.2rem + env(safe-area-inset-bottom,0px))}footer .wrap{display:flex;flex-direction:column;align-items:center;gap:.8rem}footer .logo{color:#fff}footer .logo svg{width:28px;height:28px}

</style><title>Shop</title></head><body>
<header class="stage sm"><div class="awning" aria-hidden="true"></div><div class="wrap" id="hero"></div></header>

<div class="pw"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6z"/><path d="M9 12l2 2 4-4"/></svg>Payments secured by Paystack · Powered by <a href="/">SeePay</a></div>

</form></div>
<script>
// Shared helpers. Set window.SEEPAY_ROOT before this file if the domain differs.
const ROOT = window.SEEPAY_ROOT || 'seepay.shop';
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => 'GH₵ ' + Number(n).toFixed(2);
const proto = location.protocol === 'http:' ? 'http' : 'https';
const isPhone = v => /^0\d{9}$/.test(String(v).replace(/\D/g, '').replace(/^233/, '0'));
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, '').slice(0, 30);
const initials = n => (n.match(/[A-Za-z]/g) || ['S']).slice(0, 2).join('').toUpperCase();
const tint = n => ['#FFF0B8', '#F6E7C8', '#F9D3E1', '#CFE9DB'][[...n].reduce((a, c) => a + c.charCodeAt(0), 0) % 4];
const safeImg = u => (/^(https:\/\/|\/api\/photo\/)/.test(u || '') ? esc(u) : '');
const thumb = (p, cls) => p.imageUrl ? `<img class="${cls}" src="${safeImg(p.imageUrl)}" alt="${esc(p.name)}" loading="lazy">` : `<div class="${cls}" style="background:${tint(p.name)}">${esc(initials(p.name).slice(0, 1))}</div>`;

async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} : { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'Something went wrong. Try again.');
  return j;
}
function seq(el) { [...el.children].forEach((c, i) => c.style.setProperty('--i', i)); }
function toast(m) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 2200); }
function copy(text, btn) { navigator.clipboard?.writeText(text); const o = btn.innerHTML; btn.innerHTML = '<span class="pop">Copied</span>'; setTimeout(() => btn.innerHTML = o, 1800); }
function showErr(el, m) { el.textContent = m; el.hidden = false; el.style.animation = 'none'; void el.offsetWidth; el.style.animation = ''; }
function countUp(el, to, fmt = v => v) { const t0 = performance.now(); (function f(n) { const k = Math.min(1, (n - t0) / 900); el.textContent = fmt(Math.round(to * (1 - Math.pow(1 - k, 3)))); if (k < 1) requestAnimationFrame(f); })(t0); }
async function shrink(file, max = 900) { // resize in the browser so uploads are small and fast on mobile data
  const img = await createImageBitmap(file), k = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', .8).split(',')[1];
}
const MARK = '<svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#FFC83D"/><path d="M5 8h22v6H5z" fill="#fff"/><path d="M5 8h7.33v6H5zM19.67 8H27v6h-7.33z" fill="#E4402F"/><circle cx="8.67" cy="14" r="3.67" fill="#E4402F"/><circle cx="16" cy="14" r="3.67" fill="#fff"/><circle cx="23.33" cy="14" r="3.67" fill="#E4402F"/><path d="M10.5 23l3.8 3.4 7.2-6.2" fill="none" stroke="#0E3B2C" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const TICK = '<svg viewBox="0 0 24 24" aria-hidden="true" style="width:1.1em;height:1.1em"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function addNav() { document.body.insertAdjacentHTML('afterbegin', `<nav><div class="wrap"><a class="logo" href="/" aria-label="SeePay home">${MARK}SeePay</a><div class="links"><a href="/#how">How it works</a><a href="/#features">Features</a><a href="/#pricing">Pricing</a><a href="/agent">Agents</a><a href="/#faq">FAQ</a></div><a class="btn g" href="/register">Get my shop</a></div></nav>`); }
function addFooter() { document.body.insertAdjacentHTML('beforeend', `<footer><div class="wrap"><a class="logo" href="/">${MARK}SeePay</a><span>© 2026 SeePay. Made in Ghana.</span></div></footer>`); }
const NETS = [['MTN', 'MTN MoMo', '#FFCC00'], ['VODAFONE', 'Telecel Cash', '#E60000'], ['AIRTELTIGO', 'AT Money', '#0057b8']];
function pills(el, name) { el.innerHTML = NETS.map(([v, l, c]) => `<input type="radio" name="${name}" id="${name}-${v}" value="${v}"><label for="${name}-${v}" style="--c:${c}">${l}</label>`).join(''); }

const IC = { bag: '<path d="M6 7h12l1 13H5L6 7z"/><path d="M9 7a3 3 0 0 1 6 0"/>', plus: '<path d="M12 5v14M5 12h14"/>', chat: '<path d="M21 12a8 8 0 0 1-11.5 7.2L4 20l1-4.3A8 8 0 1 1 21 12z"/>', shield: '<path d="M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6z"/><path d="M9 12l2 2 4-4"/>', camera: '<path d="M4 8h3l2-2h6l2 2h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>', clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>', store: '<path d="M4 9l1-5h14l1 5"/><path d="M4 9a2.7 2.7 0 0 0 5.3 0 2.7 2.7 0 0 0 5.4 0A2.7 2.7 0 0 0 20 9"/><path d="M5 12v8h14v-8"/>', users: '<circle cx="9" cy="8" r="3.5"/><path d="M3 20c0-3.5 2.7-6 6-6s6 2.5 6 6"/><path d="M16 5a3.5 3.5 0 0 1 0 7M18 14c2 .8 3 2.7 3 6"/>', trend: '<path d="M4 17l5-5 4 4 7-8"/><path d="M15 8h5v5"/>', copy: '<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h8"/>', wallet: '<path d="M4 7h14a2 2 0 0 1 2 2v9H6a2 2 0 0 1-2-2z"/><path d="M4 7l12-3v3"/><circle cx="16" cy="13.5" r="1"/>', ban: '<circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/>', link: '<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>', check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>' };
const ic = n => `<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]}</svg>`;
const ILL = '<svg viewBox="0 0 96 96" aria-hidden="true"><rect x="16" y="40" width="64" height="42" rx="8" fill="#CFE9DB"/><rect x="39" y="56" width="18" height="26" rx="4" fill="#0E3B2C"/><circle cx="52" cy="70" r="1.5" fill="#FFC83D"/><path d="M12 20h72l4 20H8z" fill="#fff" stroke="#0E3B2C" stroke-width="2" stroke-linejoin="round"/><path d="M24 20h12l-1.5 20H21zM48 20h12l1.5 20H49.5zM72 20h12l4 20H73.500z" fill="#E4402F"/><path d="M8 40a10 6 0 0 0 20 0 10 6 0 0 0 20 0 10 6 0 0 0 20 0 10 6 0 0 0 20 0" fill="#fff" stroke="#0E3B2C" stroke-width="2"/></svg>';

</script>
<script>
// Shop name comes from the hostname (name.seepay.shop). In preview use ?shop=name
const q=new URLSearchParams(location.search),h=location.hostname;
const sub=h.endsWith('.'+ROOT)&&!['www','app'].includes(h.slice(0,-ROOT.length-1))?h.slice(0,-ROOT.length-1):q.get('shop');
let shop,cart={};
const items=()=>shop.products.filter(p=>cart[p.id]).map(p=>({...p,qty:cart[p.id]}));
const total=()=>items().reduce((a,p)=>a+p.qty*p.price,0),count=()=>items().reduce((a,p)=>a+p.qty,0);
pills($('#net'),'net');
async function init(){
 if(!sub){$('#main').innerHTML='<div class="empty"><b>No shop selected.</b><a class="btn" href="/register">Open your shop</a></div>';return}
 if(q.get('ref'))return paid(q.get('ref'));
 try{shop=await api('/api/store?sub='+encodeURIComponent(sub))}catch{$('#hero').innerHTML='<h1 style="font:700 2rem var(--d)">No shop here yet.</h1>';$('#main').innerHTML='<div class="empty"><a class="btn" href="/register">Register this name</a></div>';return}
 document.title=shop.name;
 const wa=(shop.whatsapp||'').replace(/\D/g,'').replace(/^233/,'').replace(/^0/,'');
 $('#hero').innerHTML='<div class="hd seq"><div class="av lg">'+esc(initials(shop.name))+'</div><div><b class="hn">'+esc(shop.name)+'</b><div class="chips"><span class="chip"><span class="live"></span>'+(shop.active?'Open for orders':'Opening soon')+'</span><span class="chip">'+ic('shield')+'Pay with MoMo</span>'+(wa?'<a class="chip" target="_blank" rel="noreferrer" href="https://wa.me/233'+wa+'">'+ic('chat')+'Chat on WhatsApp</a>':'')+'</div></div></div>';seq($('.hd'));
 if(!shop.active||!shop.products.length){$('#main').innerHTML='<div class="empty">'+ILL+'<b>'+(shop.active?'No products yet.':'This shop is opening soon.')+'</b>Check back soon.</div>';return}
 $('#main').innerHTML='<div class="sec"><h2>Products</h2><span>'+shop.products.length+' available</span></div><div class="grid">'+shop.products.map((p,i)=>'<article class="pc" style="--i:'+i+'">'+'<div class="pm">'+thumb(p,'ph')+'<span class="tag">'+money(p.price)+'</span></div><div class="in2"><h3>'+esc(p.name)+'</h3><p>'+esc(p.description||'')+'</p><div class="ft"><span data-c="'+p.id+'"></span></div></div></article>').join('')+'</div>';
 shop.products.forEach(p=>ctl(p.id));bar()}
function ctl(id){const n=cart[id]||0,el=$('[data-c="'+id+'"]');if(!el)return;
 el.innerHTML=n?'<span class="step"><button data-m="'+id+'" aria-label="Remove one">−</button><b>'+n+'</b><button data-p="'+id+'" aria-label="Add one">+</button></span>':'<button class="add" data-p="'+id+'">'+ic('plus')+'Add to order</button>'}
function bar(){const n=count();$('#bar').classList.toggle('on',n>0);$('#bn').innerHTML=ic('bag')+'View order · '+n+' item'+(n>1?'s':'');$('#bt').textContent=money(total())}
function change(id,d){cart[id]=Math.max(0,(cart[id]||0)+d);if(!cart[id])delete cart[id];ctl(id);bar();if($('#ov').classList.contains('on'))sheet()}
document.addEventListener('click',e=>{const p=e.target.closest('[data-p]'),m=e.target.closest('[data-m]');if(p)change(p.dataset.p,1);if(m)change(m.dataset.m,-1)});
function sheet(){if(!count()){$('#ov').classList.remove('on');return}
 $('#cl').innerHTML=items().map(p=>'<div class="cl"><div><b>'+esc(p.name)+'</b><span class="muted">'+money(p.price)+'</span></div><span class="step"><button data-m="'+p.id+'">−</button><b>'+p.qty+'</b><button data-p="'+p.id+'">+</button></span></div>').join('');
 $('#tt').textContent=money(total());$('#pay').textContent='Pay '+money(total())}
$('#vc').onclick=()=>{sheet();$('#ov').classList.add('on')};
$('#cx').onclick=()=>$('#ov').classList.remove('on');
$('#ov').onclick=e=>{if(e.target.id==='ov')$('#ov').classList.remove('on')};
$('#sh').onsubmit=async e=>{e.preventDefault();const er=$('#er'),b=$('#pay');er.hidden=true;
 if(!$('#cn').value.trim())return showErr(er,'Enter your name.');if(!isPhone($('#cp').value))return showErr(er,'Enter a 10-digit contact phone number, like 024 123 4567.');if(!isPhone($('#cm').value))return showErr(er,'Enter a 10-digit MoMo number to charge.');const net=($('input[name=net]:checked')||{}).value;if(!net)return showErr(er,'Choose your MoMo network.');
 b.disabled=true;b.innerHTML='<i class="spin"></i>Opening Paystack';
 try{// Send only product IDs and quantities. The server must look up prices itself.
  const r=await api('/api/checkout',{slug:sub,customerName:$('#cn').value.trim(),customerPhone:$('#cp').value,items:Object.entries(cart).map(([productId,quantity])=>({productId,quantity})),fulfilment:'PICKUP',momoNetwork:net,momoNumber:$('#cm').value,website:''});try{sessionStorage.setItem('seepay-pending:'+r.reference,JSON.stringify({status:r.nextAction?.status||''}));}catch{}const hostSlug=location.hostname.endsWith('.'+ROOT)&&!['www','app'].includes(location.hostname.slice(0,-ROOT.length-1));location.href=hostSlug?('/order/'+encodeURIComponent(r.reference)):('/store/'+encodeURIComponent(sub)+'/order/'+encodeURIComponent(r.reference));}
 catch(x){showErr(er,x.message);b.disabled=false;b.textContent='Pay '+money(total())}};
function paid(ref){$('#hero').innerHTML='<h1 style="font:700 2rem var(--d)">Thank you.</h1>';
 $('#main').innerHTML='<div class="card done" id="rc" style="max-width:480px;margin:0 auto"><i class="spin" style="width:40px;height:40px"></i><h2>Confirming your payment</h2></div>';
 const t0=Date.now(),iv=setInterval(async()=>{try{const r=await api('/api/orders/'+encodeURIComponent(ref)+'/status');
  if(r.status==='SUCCESS'){clearInterval(iv);$('#rc').innerHTML='<div class="ring"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div><h2>Payment received.</h2><p class="muted">'+esc(r.shopName)+' has your order and will contact you soon.</p><a class="btn g" href="/">Back to the shop</a>'}
  else if(Date.now()-t0>60000){clearInterval(iv);$('#rc').innerHTML='<h2>Still confirming.</h2><p class="muted">If money left your wallet, the shop will still get your order. Refresh in a minute.</p>'}}catch{}},2000)}
init();
</script></body></html>
